<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="blurFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="55" result="blur" />
    </filter>

    <filter id="subtleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      .orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 16s ease-in-out infinite alternate;
      }
      .pulse-ring {
        animation: pulseEffect 4s ease-out infinite;
        transform-origin: 1040px 140px;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: dashAnimation 30s linear infinite;
      }
      .pill-float {
        animation: floatPill 6s ease-in-out infinite alternate;
      }
      .pill-float-reverse {
        animation: floatPillRev 7s ease-in-out infinite alternate;
      }
      .node-pulse {
        animation: nodeGlow 3s ease-in-out infinite alternate;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(80px, 40px) scale(1.15); }
        100% { transform: translate(-50px, 70px) scale(0.95); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-90px, -30px) scale(1.1); }
        100% { transform: translate(60px, -50px) scale(0.9); }
      }
      @keyframes pulseEffect {
        0% { r: 35px; opacity: 0.8; stroke-width: 1.5; }
        50% { opacity: 0.4; stroke-width: 1; }
        100% { r: 90px; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes dashAnimation {
        from { stroke-dashoffset: 600; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
      @keyframes floatPillRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes nodeGlow {
        0% { opacity: 0.4; }
        100% { opacity: 0.95; }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Dynamic Glowing Orbs (Kept safely blurred and behind foreground) -->
  <g filter="url(#blurFilter)">
    <circle class="orb-1" cx="220" cy="110" r="160" fill="url(#glowCyan)" />
    <circle class="orb-2" cx="980" cy="300" r="180" fill="url(#glowPurple)" />
    <circle class="orb-1" cx="1060" cy="100" r="130" fill="#0284c7" opacity="0.35" />
    <circle class="orb-2" cx="140" cy="340" r="140" fill="#4338ca" opacity="0.4" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Subtle Ambient Circuit Streams (Background Flow) -->
  <g fill="none" opacity="0.55">
    <path class="dash-flow" d="M -50 210 Q 300 120 600 210 T 1250 200" stroke="#0284c7" stroke-width="1.5" />
    <path class="dash-flow" d="M -50 310 Q 350 380 750 290 T 1250 330" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <path class="dash-flow" d="M -50 100 Q 400 40 850 120 T 1250 90" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
  </g>

  <!-- Dynamic Cloud Resiliency Topology Diagram (Right Side Decorative Element) -->
  <g transform="translate(90, 0)">
    <!-- Expanding Pulse Rings -->
    <circle class="pulse-ring" cx="950" cy="160" r="35" fill="none" stroke="#38bdf8" />
    <circle class="pulse-ring" cx="950" cy="160" r="55" fill="none" stroke="#818cf8" style="animation-delay: 2s;" />

    <!-- Satellite Hub Rings and Shield Symbolism -->
    <circle cx="950" cy="160" r="42" fill="#0f172a" stroke="#00f2fe" stroke-width="2" />
    <!-- Resilient Cloud Icon in Center Hub -->
    <path d="M 938 165 C 935 165 932 162 932 159 C 932 156 934 154 937 153 C 938 147 943 143 949 143 C 955 143 960 147 961 152 C 963 152 967 154 967 158 C 967 162 964 165 960 165 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 949 168 L 949 157 M 945 161 L 949 157 L 953 161" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Orbital Nodes -->
    <!-- Node 1: Immutable Vault -->
    <line x1="950" y1="160" x2="840" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
    <circle cx="840" cy="90" r="22" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5" />
    <circle class="node-pulse" cx="840" cy="90" r="8" fill="#38bdf8" />
    <text x="840" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AIR-GAP VAULT</text>

    <!-- Node 2: Cyber Recovery -->
    <line x1="950" y1="160" x2="1050" y2="85" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
    <circle cx="1050" cy="85" r="20" fill="#0b1329" stroke="#a855f7" stroke-width="1.5" />
    <circle class="node-pulse" cx="1050" cy="85" r="7" fill="#a855f7" />
    <text x="1050" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CLEANROOM DR</text>

    <!-- Node 3: Zero-Egress Object Storage -->
    <line x1="950" y1="160" x2="1040" y2="245" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
    <circle cx="1040" cy="245" r="20" fill="#0b1329" stroke="#06b6d4" stroke-width="1.5" />
    <circle class="node-pulse" cx="1040" cy="245" r="7" fill="#06b6d4" />
    <text x="1040" y="280" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">ZERO-EGRESS S3</text>

    <!-- Node 4: SaaS Connectors -->
    <line x1="950" y1="160" x2="850" y2="240" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
    <circle cx="850" cy="240" r="20" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5" />
    <circle class="node-pulse" cx="850" cy="240" r="7" fill="#3b82f6" />
    <text x="850" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SaaS DIRECT API</text>
  </g>

  <!-- FOREGROUND: Main Title, Subtitle, and Feature Badges (Always crisp, prominent, high contrast) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Category Tag -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#0c1a30" stroke="#0284c7" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#00f2fe" />
      <text x="26" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CLOUD DATA RESILIENCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome SaaS Data Resiliency
    </text>

    <!-- Subtitle -->
    <text x="0" y="188" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0">
      Cloud Ecosystem &amp; Open-Source Protection Engines
    </text>

    <!-- Tagline description -->
    <text x="0" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      Curated directory of 100% SaaS BaaS platforms, ransomware cyber vaults, and self-hosted backup standards.
    </text>

    <!-- Interactive / Floating Feature Pills in Lower Zone -->
    <g transform="translate(0, 270)">
      <!-- Pill 1 -->
      <g class="pill-float" transform="translate(0, 0)">
        <rect width="145" height="38" rx="8" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1.2" />
        <circle cx="20" cy="19" r="5" fill="#10b981" />
        <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">100% Pure SaaS</text>
      </g>

      <!-- Pill 2 -->
      <g class="pill-float-reverse" transform="translate(160, 0)">
        <rect width="185" height="38" rx="8" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1.2" />
        <circle cx="20" cy="19" r="5" fill="#06b6d4" />
        <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Ransomware Vaults</text>
      </g>

      <!-- Pill 3 -->
      <g class="pill-float" transform="translate(360, 0)">
        <rect width="195" height="38" rx="8" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1.2" />
        <circle cx="20" cy="19" r="5" fill="#a855f7" />
        <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Self-Hosted Engines</text>
      </g>

      <!-- Pill 4 -->
      <g class="pill-float-reverse" transform="translate(570, 0)">
        <rect width="165" height="38" rx="8" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1.2" />
        <circle cx="20" cy="19" r="5" fill="#f59e0b" />
        <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Audited Security</text>
      </g>
    </g>

  </g>

  <!-- High-Tech Bottom Accent Line -->
  <line x1="0" y1="418" x2="1200" y2="418" stroke="#0284c7" stroke-width="3" opacity="0.8" />
  <line x1="300" y1="418" x2="600" y2="418" stroke="#00f2fe" stroke-width="3" opacity="1" />
</svg>
